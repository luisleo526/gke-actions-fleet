name: Native Linux CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        architecture: [amd64, arm64]
    runs-on: ${{ format('gke-8cpu-16gb-{0}', matrix.architecture) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -c 'import platform; print(platform.machine())'
      # Add your project's install/build/test steps here. For native toolchains
      # use the optional images/runner image described in docs/migration.md.
