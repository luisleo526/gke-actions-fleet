name: Fleet secrets and environment
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on:
      group: gke-runners
      labels: gke-4cpu-8gb-amd64
    environment: staging
    timeout-minutes: 30
    env:
      REPO_TOKEN: ${{ secrets.CI_API_TOKEN }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify credentials without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          test -n "$DEPLOY_TOKEN"
          test -n "$API_URL"
          printf 'Repository and environment settings are available.\n'
      - name: Install a job dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends jq
          jq --version
      # Add the repository's build/deployment steps. Cloud OIDC federation and
      # environment approvals must be configured independently by the operator.
